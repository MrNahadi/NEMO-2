[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-engine"
version = "0.1.0"
description = "NEMO 2 design engine: code checks, optimisation, CAD and FEA for marine structural details."
requires-python = ">=3.11,<3.13"
dependencies = [
  "build123d>=0.13,<0.14",
  "ezdxf>=1.4,<2",
  "gmsh>=4.13,<5",
  "scikit-fem>=12,<13",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyamg>=5.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "reportlab>=4.2",
  "matplotlib>=3.9",
  "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nemo-server = "nemo.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nemo.data" = ["*.json", "fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
